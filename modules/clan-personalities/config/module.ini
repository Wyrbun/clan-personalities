# Clan Personalities (Phase 1: the drama)
# Master on/off switch. With this false the module does nothing and the server is stock.
Enabled = True

# ── Clans ────────────────────────────────────────────────────────────────────
# Comma-separated list of living clans to animate. Each entry may be:
#   - the clan's numeric id,           e.g. 1078060253
#   - the clan's name or config key,   e.g. Azure_Dragon
# Name entries are resolved at runtime by clan name; underscores, spaces and
# capitalization don't matter ("Azure_Dragon" matches "Azure Dragon"). A
# misspelled key never matches: the module warns once in the server log
# listing the keys that never found a clan. The module adds no clans.
# Example:
#   LivingClanIds = Azure_Dragon, Blood_Raven, Whisperfang
LivingClanIds = Azure_Dragon, Blood_Raven, Crimson_Phoenix, Emerald_Serpent, Frost_Moon, Golden_Lion, Iron_Hammer, Ivory_Crown, Obsidian_Eye, Silver_Wolf, Sun_Spear, Violet_Spider

# Persona assignment mode.
#   STABLE    - (default) personas are dealt once, stored in the module folder
#               (personas.properties, written next to module.json) and kept
#               VERBATIM between restarts: a clan that's aggressive always is.
#               New clans added to LivingClanIds get dealt on the next boot
#               without touching the others. Deleting the file lets the
#               module deal everything fresh on its next launch, and you can
#               hand-edit the file's lines if you want to swap a persona.
#   RANDOM    - a fresh deal on EVERY boot; the world's moods reshuffle each
#               restart. The stored deal is not overwritten, so switching
#               back to STABLE restores it. Off by default on purpose:
#               players would find shifting clan personalities odd.
#   EXPLICIT  - you dictate the persona per clan via PersonaMap (cap not
#               applied).
PersonaMode = STABLE

# For EXPLICIT: clan:persona pairs separated by ';' . Persona names are
# peaceful, neutral, altruistic, aggressive, player-killing. The clan side may
# be the numeric id or the name/key, exactly like LivingClanIds.
# Example: PersonaMap = Azure_Dragon:aggressive;Whisperfang:neutral
PersonaMap =

# The dealt cap in STABLE and RANDOM modes: how many clans may share one
# persona, so chat never turns into five identical gloomy voices. Clans that
# do not fit stay persona-less and silent. The default 3 covers the full
# 12-clan Living World roster (3 x 5 personas = 15 slots) with room to add.
MaxClansPerPersona = 3

# ── Alliances (chat context: who defends whom) ─────────────────────────────
# Groups separated by ';', each "name:id,id,id". Clans not listed have no
# alliance relationship. Clan entries may be ids or name/keys, as above.
# Example: AllianceGroups = alpha:Azure_Dragon,Blood_Raven;bravo:Whisperfang
#
# Pre-wired to the pack's own alliances (game\data\BotClans.xml):
AllianceGroups = DragonPact:Azure_Dragon,Emerald_Serpent,Frost_Moon,Silver_Wolf;PhoenixOrder:Crimson_Phoenix,Golden_Lion,Sun_Spear,Ivory_Crown;RavenCovenant:Blood_Raven,Obsidian_Eye,Iron_Hammer,Violet_Spider


# ── Tempo and anti-clutter ───────────────────────────────────────────────────
# How often (milliseconds) the drama tick runs. Each tick rolls chances, it
# does not guarantee speech.
DramaPeriodMillis = 90000

# Base chance (%) per tick that an eligible clan opens a drama.
# The persona's temperament multiplies this (Aggressive x1.0,
# Player-Killing x0.8, Altruistic x0.15, Neutral x0.05, Peaceful x0).
DramaStartChance = 20

# Percent chance per tick that an idle clan makes low-key ambient chatter.
AmbientChance = 3

# Chance (%) that an idle Aggressive or Player-Killing clan piles onto OTHER
# people's drama. Altruistic responds to alliance matters without this roll,
# and Neutral never does.
OpportunisticChance = 10

# Global send cap per hour window, ALL speech combined. Excess messages are
# postponed into the next window, not dropped. Keep this reasonably high
# Cap on clan messages in ANY hour window. This is a pure SAFETY NET: with
# the read-and-type spacing floor the world can never flood, so set this
# high - a cap the world can actually reach makes it speak in bursts and
# then go silent for the rest of the hour.
MaxMessagesPerHour = 200

# After a clan speaks (or reserves the floor by queuing), it goes quiet this
# many seconds. Short cooldowns keep clan-to-clan exchanges conversational:
# a comeback lands right after the provocation instead of minutes later.
ClanCooldownSeconds = 45

# How many clans, at most, answer one opening drama message.
MaxResponsesPerDrama = 2

# ── Getting started fast ────────────────────────────────────────────────────
# The FIRST drama of a boot is guaranteed: within this many seconds after
# the server starts, the engine forces one opening quarrel (if a clan that
# opens has members in the world), so the stage is set before you finish
# watching the login screen. 0 disables the warm-up.
FirstDramaMaxSeconds = 300

# How long a NEW quarrel (or an ambient line) may sit in the queue before
# it speaks. Ongoing arguments answer on the rank bands further below, so
# they never wait this long.
MinOpeningDelaySeconds = 0
MaxOpeningDelaySeconds = 120

# ── Rank-paced replies (arguments ONLY) ────────────────────────────────────
# Inside an ongoing argument, the speaker's RANK picks how fast the reply
# comes and who speaks. All bands are random ranges "min-max" in seconds:
# the leader replies fastest, officers are faster than members, and most
# beats still go to members. Nothing waits longer than half a minute.
LeaderReplyBand = 10-20
OfficerReplyBand = 15-30
MemberReplyBand = 22-42

# ── Human read-and-type spacing ─────────────────────────────────────────────
# No two clan lines may land closer than this, anywhere in the engine, even
# if two beats fall due together: the second one holds its turn for the
# remainder, the way a player reads the last shout and then types their own.
MinBeatSpacingSeconds = 8

# Who carries each beat: the leader takes one rarely (he has others speak
# first), officers sometimes, members most of the time. When the argument's
# last reply took LONGER than LeaderPatienceSeconds, the officers were too
# slow: the leader steps in with LeaderPatienceChance instead.
LeaderReplyChance = 10
OfficerReplyChance = 30
LeaderPatienceSeconds = 30
LeaderPatienceChance = 35

# Players talk on top of each other: with this chance, the beat comes with
# a second, JUNIOR voice of the same clan blurting an aside right around
# the main reply - and the senior voice then visibly takes over.
ChatterOverlapChance = 35

# The called-out clan, instead of firing back blindly, may first DEMAND the
# point: "what do you want from us?" - the accuser then explains its side
# (grounded in the incident), and only then comes the real comeback. This
# is what makes quarrels proper back-and-forth exchanges instead of name
# calling; the answer always follows a question.
QuestionChance = 40

# ── Kindness (the positive beats) ──────────────────────────────────────────
# Clans can do each other good, even across alliances: sharing a hunting
# ground, word of danger, a plain salute. The helped clan thanks; hot-
# blooded helpers may answer the thanks cocky. BOTH sides remember the
# kindness, and later quarrels between them may reference that history.
# Bad drama keeps priority: KindnessCalmOnly=True lets positive beats roll
# only while NO argument is running anywhere.
KindnessChance = 8
KindnessCalmOnly = True
CockyReplyChance = 55

# ── Drama arcs (arguments end with a solution) ─────────────────────────────
# An argument is an arc of replies, normally ending before the round cap:
#   ResolveChance is the percent chance per delivered reply line that the
#   argument reaches its "solution" - a war cry (fight) or a diplomatic
#   close (peace). The closing clan's persona weighs which ending: hot clans
#   prefer to fight, calm clans prefer peace. On the round cap it resolves
#   regardless, so no argument loops forever.
# After an argument ends, those two clans rest before a NEW argument not a
# random number of minutes in this range, so the same pair can't monopolize.
MaxDramaRounds = 8
ResolveChance = 20
MinPairRestMinutes = 5
MaxPairRestMinutes = 10

# ── Clan voices (leader / officer / member) ────────────────────────────────
# Every clan member holds a stable role derived from their name, ordered
# leader, officer, member. A clan's CURRENT talker keeps the word while he is
# in the world (consistency: one bot argues one quarrel); a present higher
# rank takes over, and may introduce himself. When the other side's talkers
# bounce too often, it may ask who now speaks - once per argument - and the
# new voice identifies himself. All those lines are brain-written.
AbbreviationOverrides = Sun_Spear=SP
LeaderTitle = clan leader
OfficerTitle = officer
MemberTitle = member
AnnounceTakeoverChance = 40
LeadershipAskChance = 60

# ── Offense causes (what the quarrels are actually about) ──────────────────
# Clan drama stops being noise when it has a reason. When a clan opens drama
# the engine draws one of these incidents for the whole argument and the
# brain is told what the quarrel is about; while the grudge lasts, the same
# pair REMEMBERS the same complaint. Comma-separated, in plain language, fed
# to the brain exactly as written. (Real combat evidence comes in a later
# phase; these opens are in-world rumor for now.)
OffenseCauses = kill-stealing mobs, stealing loot, spawn camping, trade scamming

# ── Typo habits (humans mistype; bots are allowed to be human) ─────────────
# Brain-written lines are kept EXACTLY as written, typos included. When a
# delivered line contains a visible accidental slip (a doubled word like
# "the the", a missing space after punctuation), the SAME bot may then send
# a short, player-style correction ("I meant ..."). The chance below applies
# to visible slips only, so it stays rare and chat is never flooded with
# bots forcefully making typos.
SelfCorrectionChance = 10

# How long (minutes) two clans remember an argument for. Within this window
# they talk sooner and to each other first; after it, grudges fade.
GrudgeWindowMinutes = 120

# ── War stories (old quarrels remembered) ───────────────────────────────────
# How long (minutes) a finished argument is remembered as a war story, long
# after the fresh grudge has faded. A clan may retell it; a clan-less
# bystander may then ask what happened, and both clans give their version.
StoryWindowMinutes = 360
# Percent chance per calm tick that a remembered quarrel is retold, and the
# percent chance the retelling pulls a "what happened?" from the crowd.
HistoryChance = 6
StoryAskChance = 45

# ── Drama focus, taunts and threat reading ──────────────────────────────────
# Drama focus: ONE quarrel develops at a time. While an argument is still
# breathing (a beat within FocusStaleSeconds), NEW openings - fresh
# quarrels, taunts, chatter callouts - wait their turn instead of piling on.
# When it resolves, the stage catches its breath for FocusBreatherSeconds,
# then the next held opening lands. Plain chatter is never held. [FOCUS]
DramaFocus = True
FocusStaleSeconds = 120
FocusBreatherSeconds = 45

# Taunts: Aggressive and Player-Killing clans goad other clans toward a REAL
# field fight ("send your fighters outside Giran, if you dare"). A taunt
# opens an argument like any quarrel (and starts its brew one beat warm);
# the dared clan answers by temperament. Odds are per drama tick per
# eligible clan; each clan then rests TauntCooldownMinutes before taunting
# again, and the whole world rests TauntGlobalCooldownMinutes between any
# two taunts. Alliance brothers are never taunted; old grudges are three
# times as tempting a target. TauntChance = 0 disables. [TAUNT]
TauntChance = 20
TauntCooldownMinutes = 15
TauntGlobalCooldownMinutes = 6

# Threat reading: every quarrel line aimed at a clan is READ by that clan:
#   THREAT      - threat words, no laugh  -> taken seriously, the brew heats
#   PROVOCATION - insults, no threat      -> trash talk meant to rile them
#   AMBIGUOUS   - threat words + a laugh  -> the target may ASK "do you mean
#                 it?"; the speaker confirms (brew heats, the ending leans
#                 to steel) or waves it off (brew cools, the quarrel winds
#                 down sooner). Who confirms is temperament: Player-Killing
#                 and Aggressive mostly stand by it, Peaceful mostly not.
# The reading is passed to the brain, so the reply answers it as such.
# ThreatClarifyChance is the base odds of asking (calm clans ask more,
# hot clans less); one ask per pair per ThreatClarifyCooldownSeconds.
# Cue lists are comma-separated, case-insensitive, whole-word matched
# (leave a key out to keep the built-in list). [READ] [READ-ASK]
# [READ-CONFIRM] [READ-DEFUSE]
ReadThreats = True
ThreatClarifyChance = 50
ThreatClarifyCooldownSeconds = 300
ThreatCues = watch your back,watch your backs,watch their back,watch their backs,you're dead,youre dead,you are dead,gonna regret,will regret,you'll regret,pay for this,pay for that,gonna pay,will pay for,hunt you,hunt them,hunt you down,kill you,kill them,kill 'em,end you,crush you,crush them,crush 'em,lose a finger,bleed,meet me outside,catch me outside,come fight,bring it,fight me,last warning,or else,count your days,sleep with one eye,coming for you,coming for them
BanterCues = lol,lmao,haha,hehe,rofl,xd,:p,:),:d,jk,just kidding,kidding,joking
ProvocationCues = all talk,noob,newbie,lowbie,get a life,clown,scrub,coward,cry more,crybaby,trash,pathetic,kiss my boots,lame

# ── Phase 2: field encounters (real duels, world-witnessed) ─────────────────
# Master switch for the physical part of the drama. With this on, clan members
# in the open field may step on each other's toes and settle it with a REAL
# duel (the pack's own combat, no theater): staged OUTSIDE every town zone,
# announced by the aggressor's side, occasionally narrated by a spectator clan
# (Peaceful clans berate both sides), and closed by both sides' words - the
# loser may blame its idle alliance members by name in world chat.
# ON by default since 0.2.0 (public testing). Set False for chat-only drama.
Phase2 = True
# Base odds (%) per drama tick that a duel breaks out between two members of
# different clans standing close together in the field. Actor personas weigh
# in: Aggressive and Player-Killing use the full chance, Neutral a third,
# Altruistic a quarter, Peaceful clans never start a fight (but still harp on
# one). A pair with a live grudge flares at TWICE this chance. Fighters who
# were already busy hunting or partying are drafted at HALF this chance.
EncounterChance = 40
# How far apart (game units) two clan members may be for a challenge to form.
# The distance is only the challenge's reach - the duel arena itself is
# stepped in just outside the gates of the nearest major town (Giran gets
# first call when in reach), on open ground, clear of gate guards, so nobody
# misses a brawl for distance.
EncounterScanRadius = 20000
# Hard cap (seconds) on any duel: the clock decides between "someone bled
# clearly less and yields the field" and "both withdraw, even". Deaths end a
# duel instantly when they happen.
EncounterFightMaxSeconds = 90
# Percent odds that ONE spectator clan (Peaceful first in line) narrates the
# clash mid-fight with a single line: scorn for Peaceful voices, an onlooker's
# jab or gasp for everyone else.
EncounterCrowdChance = 60
# Percent odds that a hot-blooded loser (Aggressive or Player-Killing) calls
# out its OWN alliance members by name in world chat for leaving it alone in
# the fight.
LoserBlameChance = 50

# Peaceful clans never throw the first blow: in a duel against any other
# clan, the other side always swings first. If two Peaceful clans ever face
# each other, this is the chance (%) that one of them loses its patience
# after all; otherwise neither swings and the duel is dropped.
PeacefulEngageChance = 30

# Duel interference. Duels are between the two clans: if someone from
# outside (a real player or their summon) damages or debuffs a duel's
# fighters or spectators, the duel is called off and everyone present
# defends themselves against the intruder. Heals and buffs don't count.
DuelInterference = True
# How the defence plays out: most defenders at once, seconds between
# reinforcements and how many each brings, and a safety stop in minutes.
InterferenceMaxPursuers = 6
InterferenceWaveSeconds = 20
InterferenceWaveSize = 2
InterferenceMaxMinutes = 15

# One-time cleanup (2026-10-19). Builds before this date saved every fight
# clone (fighters, heralds, fans) as a real character on the internal
# "phantom" account, and the pack then refused to clone those town bots
# again. Off = do nothing. Preview = ~150 s after boot, LIST in the server
# log (READ-ONLY) every saved character sharing a town bot's name, with its
# account ([CLONE-LIST]). Delete = remove them with the
# game's own full character delete ([PURGE-DELETE]). Only rows on the
# phantom account whose name matches a town bot, that are not Living
# Population bots and not online, are touched; player accounts are never
# read. Set it back to Off afterwards.
PurgeSavedClones = Off

# ── Phase 3: crime and consequence ──────────────────────────────────────────
# Master switch for Phase 3. In 0.3.0 it carries the player accusations
# below: accuse, praise, take sides, greet a clan, insist. The later Phase 3
# steps (ally assists, ambushes, bounties) are not built yet. False turns
# everything below off.
Phase3 = True

# Player accusations. A real player's chat line that names a clan and
# accuses it (killing, camping, cheating, defending aggressors), praises it,
# takes a side in a quarrel that is running, or claims to have seen
# something, gets an answer from that clan - by its temperament. The module
# picks the stance (a Peaceful clan questions a killing charge, an
# Aggressive one confirms it true or not and denies ever being nice...);
# the brain writes the words. Works with Phase 1 alone.
Accusations = True
# Which of the player's channels count. SHOUT and TRADE are world chat;
# GENERAL (local) counts only when a member of the named clan stands within
# earshot (1250), and that member answers locally. Whispers never count -
# the pack's own brain already answers whispers to bots.
AccusationChannels = SHOUT,TRADE,GENERAL
# Words that make a line an accusation, by deed. Matching ignores case and
# apostrophes; words of 4+ letters also match longer forms ("camp" hits
# "camped"), short ones like "pk" or "ks" must stand alone (or end in
# -ed/-d/-s). A line that only names a clan, with none of these, is ignored.
AccuseKillCues = killed,kill,pk,pked,ganked,gank,ambushed,jumped,murdered,wrecked,griefed,griefing,farmed
AccuseCampCues = camped,camping,spawn camp,ks,ksed,kill steal,kill stealing,stole my spot,stealing spots,trained,train,training mobs
AccuseCheatCues = cheated,cheater,cheating,scam,scammed,scammer,lied,liar,robbed,stole,stolen,steal,stealing,thief,thieves,ninja looted,looted my
AccuseDefendCues = defended,defending,protected,protecting,sided with,backed,covered for,covering for
# Praise: matters most for Aggressive and Player-Killing clans, who deny
# ever being kind.
PraiseCues = helped,helping,healed,buffed,saved,gave me,nice,kind,generous,friendly
# "I saw it": a witness claim, strongest on a quarrel that is running.
WitnessCues = i saw,i was there,witnessed,saw it,saw them,i watched,seen it
# Taking a side in a running quarrel. The cue belongs to the clan named just
# before it: "IvoryCrown is right, SunSpear started it" blames SunSpear.
SideForCues = is right,are right,was right,telling the truth,tell the truth,innocent,side with,on their side,believe them
SideAgainstCues = started it,start it,lying,their fault,his fault,her fault,to blame,blame them,dont believe
# Pacing. A short floor in seconds between two lines from the same player
# (it only stops double posts - the real brake is the rate limit below),
# seconds before the same clan answers another accusation, the world-wide
# cap per hour (it protects the shared brain), and the most clans one line
# may accuse at once.
AccusationCooldownSeconds = 10
AccusedClanCooldownSeconds = 600
AccusationsPerHour = 6
AccuseMaxClans = 3
# Chance (%) that a Peaceful clan accused of killing actually admits it.
# "Almost zero" by design.
PeacefulConfirmChance = 1
# After the accused answers, the wronged clan reacts (outraged at a confirm;
# at a denial hot clans disbelieve, Peaceful ones let it go) and up to
# AccuseBystanders other clans weigh in: alliance brothers stand up for the
# accused (or admit "that does sound like them"), calm clans vouch, hot
# clans mock a Peaceful accused as "carebears", someone calls out an
# Aggressive clan's fake confession, and clans with bad blood back the
# accusation up. AccuseMaxLines caps all clan lines one accusation can draw
# (answers included); every line still counts against MaxMessagesPerHour.
AccuseBystanders = 2
AccuseMaxLines = 5
# A confirmed accusation, a denial nobody believes, or a "carebears" mock
# starts a real quarrel about it and heats the pair toward a duel by this
# many brew beats (half again more when the pair already runs hot).
AccusationBrewBeats = 2
# Taking a side in a running quarrel heats it by this many beats; claiming
# to have witnessed it, twice that.
AccuseTipBeats = 1
# Chance (%) that a hot clan mocks a Peaceful accused as "carebears".
AccuseMockChance = 50
# Chance (%) that an ally of an Aggressive or Player-Killing accused admits
# "that does sound like them" when the record backs the accusation.
AllyAdmitChance = 40
# An Aggressive clan cannot bear to be seen as nice. Praise it for a
# kindness it really did (one on record this session) and another clan will
# say so - then it denies it vehemently, drops out of its arguments and says
# nothing at all for this many minutes.
NiceSulkMinutes = 15

# The player's reputation (kept in memory only: a restart wipes it).
# Clans believe the player by default. Credibility (0-100) drops only when
# the player is CAUGHT lying - a claim the module's memory contradicts,
# called out in public by another clan - and recovers slowly. A claim the
# module can't check can never count as a lie.
CredibilityLiePenalty = 30
CredibilityRegenPerHour = 10
# Below 50 the player is doubted (calmer clans brush denials off, fewer
# clans back the accusation up). Below SuspicionThreshold the player is a
# known stirrer: every clan doubts them, owning-up chances halve, and one
# clan may call them out in world chat (at most once per
# StirrerCallOutMinutes). When a lie is exposed, a chaos-loving clan
# (Aggressive or Player-Killing) may praise the player for it.
SuspicionThreshold = 40
StirrerCallOutMinutes = 60
# The rate limit. More than AccuseBurstLimit accusations inside
# AccuseBurstWindowSeconds earns ONE warning line from a clan. Another one
# before the window clears and the player is silently ignored for a random
# AccuseIgnoreMinMinutes-AccuseIgnoreMaxMinutes, times (1 + earlier
# transgressions), at most AccuseIgnoreCapMinutes. Each ignored line is
# still logged ([ACCUSE-IGNORED]). Transgressions fade by one per
# TransgressionDecayHours without a warning.
AccuseBurstLimit = 3
AccuseBurstWindowSeconds = 600
AccuseIgnoreMinMinutes = 5
AccuseIgnoreMaxMinutes = 15
AccuseIgnoreCapMinutes = 90
TransgressionDecayHours = 6

# Slice 2c - talking to a clan, and insisting.
# Naming a clan with a greeting or a question ("what's up, SunSpear?",
# "hey IvoryCrown, what do you want") is NOT an accusation: the first named
# clan that can answer says one short line in its own temper. It costs no
# credibility and doesn't count toward the rate limit or the hourly cap;
# a player being silently ignored stays ignored, and a sulking clan stays
# silent. CasualReplyToQuestions = True also counts any line with a "?"
# that names a clan. Short cues (3 letters or fewer, like "hi") match only
# as whole words.
CasualReplies = True
CasualReplyToQuestions = True
AddressCues = whats up,sup,wassup,hey,hi,hello,yo,oi,greetings,what do you want,what you want,what do you guys want,wyd,how are you,hows it going,how goes,anyone there,you there,where are you,what are you doing,what are you up to
CasualCooldownSeconds = 30
CasualClanCooldownSeconds = 120
CasualRepliesPerHour = 20
# Insisting: within InsistWindowSeconds of an answered accusation (or
# praise, or blame), "they really did it", "I swear" or the same charge
# again presses the clan that answered. It answers firmer; if the module's
# record backs the claim it may crack and admit it (Peaceful: InsistAdmitChance,
# Neutral 50, Altruistic 40, all halved for a known stirrer), and the clan it
# wronged reacts. A lie nobody exposed yet gets a second chance: a calm clan
# sets the record straight. Pushing a lie that was already exposed costs
# InsistLiePenalty credibility. At most InsistMax presses per charge; each
# counts toward the rate limit. Naming a DIFFERENT clan while insisting
# moves the charge onto it ("no, IronHammer really did it"). Insist cues
# always match as whole words ("they did" never hits "they didn't").
InsistCues = really did it,really did,did too,they did,i swear,swear it,swear on,telling you,its true,trust me,believe me,for real,no really,i mean it,i know what i saw
InsistWindowSeconds = 300
InsistMax = 2
InsistAdmitChance = 25
InsistLiePenalty = 10

# ── Voice ───────────────────────────────────────────────────────────────────
# Where clan speech goes. SHOUT = the world chat channel, visible everywhere
# in the world (what a player types with "!"). GENERAL = the small bubble only
# players standing next to the bot can read. Default SHOUT: the drama is meant
# to be witnessed.
ChatChannel = SHOUT

# A clan only speaks through a member that is actually in the world (anywhere
# in the world). With no member online in-world, the clan holds its tongue.
RequireMembersPresent = True

# Debug: log every delivered clan line (kind, speaker, channel, text) to the
# server log, so speech is provable even when you're far from the speaker.
Debug = False

# Test commands, for testing alone: with this AND Debug on, typing .clanp in
# game shows the clans' state and lets you seed a kindness, heat a pair
# toward a duel, set your credibility and clear cooldowns. Keep it off for
# normal play; the deploy script turns it on in the live test copy.
TestCommands = False

# ── LLM tier (the pack's FPC brain - REQUIRED) ─────────────────────────────
# The pack's FPC brain (brain\fpc_brain.py, http://127.0.0.1:5000/chat) is
# this module's ONLY voice: drama lines, argument endings, takeover brags,
# the "who speaks now?" exchange, clarify asides and typo corrections are
# all written by it fresh, in the speaking bot's own stable voice. There are
# no static line pools anymore, so:
#   - at boot the module PROBES the brain; if it cannot answer, the module
#     logs an ERROR and stays inactive (the server behaves as if the module
#     were absent);
#   - if the brain goes down later, the clans simply stay silent until it
#     answers again; nothing is spoken in their place.
# The module keeps all its other rules: personas, queue, caps and cooldowns
# decide WHEN and WHO; the brain decides the words.
# The brain is addressed in the same mode as ChatChannel (SAY or SHOUT).
BrainUrl = http://127.0.0.1:5000/chat
# How long to wait for the brain to finish ONE line. A local 12B model
# writing a drama reply can legitimately need 20-40 seconds, and the pack's
# own chat bridge allows 45. The old 8 s made every slow generation a
# failure - and one failure silenced the whole world for ten minutes.
# Keep this at (or above) 45000.
BrainTimeoutMillis = 45000
# LEGACY door only (see BrainVoiceMode below). On the old SHOUT/SAY door the
# brain's anti-spam layer cooldown-blocks unmarked bot chatter by topic, so
# module lines there pose as human (X-Human: true) - which also files the
# composed prompt into the brain's shout log. On the default PARTYEVENT door
# this flag is IGNORED: X-Human is never sent there, and every request carries
# X-Directed-By (BrainDirectedHeader) so the brain can recognise module lines.
BrainHumanFlag = True
# Which brain door module lines use. PARTYEVENT (default): the brain's
# directed one-line mode - the module describes the moment, the bot says ONE
# line for it, with no shared shout backlog around it and nothing filed into
# that backlog. LEGACY: the old SHOUT/SAY door, where every instruction posed
# as an overheard shout wrapped in the last 12 world lines - bots then often
# answered the world chatter (essence prices, crypt parties) instead of the
# drama. Keep PARTYEVENT unless the brain changes.
BrainVoiceMode = PARTYEVENT
BrainDirectedHeader = clan-personalities

# How many recent messages (RAM only) the engine retains to adapt tempo and
# targets. Memory does not persist between restarts in this phase.
MemorySize = 60

# Placeholder used instead of a clan name until one of its members shows up.
UnknownClanName = another clan

# ── Shorthand (nicknames) and confusion chatter ────────────────────────────
# Clan and alliance names are mouthfuls; bots know it. When a clan (or an
# alliance name) is mentioned in delivered speech, it may be shortened to its
# initials ("AzureDragon" -> "AD", "DragonPact" -> "DP"). Clan-LESS bystanders
# (shop fake players and drifting phantoms that wear no clan crest) may then
# ask what the shorthand means, and the named clan answers - at most once per
# mentioned clan or alliance per cooldown window, so it stays a running joke
# and never a flood. Both question and answer are brain-written.
Shorthand = True
ShorthandChance = 25
Clarify = True
ClarifyCooldownHours = 6

# Funny clan nicknames, "Clan=Nick" pairs. When a clan carries one, its name
# in a spoken line may be swapped for the fun name instead of the initials -
# the way players coin silly nicknames for clan names all the time. The
# clarify chatter ("what's X?") may then ask about the NICKNAME itself, and
# the clan proudly clears it up. Comma-separated.
# Example: ClanNicknames = Ivory_Crown=Ivy Crown, Silver_Wolf=the dogs
ClanNicknames = Ivory_Crown=Ivy Crown
# Percent chance that a clan WITH a nickname uses the fun name this line
# (otherwise the plain initials/shorthand rules decide, as before).
NicknameChance = 45
# Nickname drift: percent chance per quiet drama tick that the BRAIN coins
# one more player-style nickname for a clan that has none yet. Coined names
# are stored in nicknames.properties next to personas.properties, so the
# world's slang STICKS between restarts (and your hand-tuned names in
# ClanNicknames always outrank the brain's coins for the same clan).
NicknameDriftChance = 4
# Challenge steel: when a delivered clan line dares somebody (any phrase in
# the list below, case-insensitive), the challenged clan answers with the
# heat its persona demands - and with ChallengeFightChance percent odds the
# dare becomes a REAL field duel at the town gates (when the stage is free).
ChallengeCues = come fight me,bring it,fight me,meet me outside,catch me outside
ChallengeFightChance = 35
# Arena siting. The search starts at the guards standing OUTSIDE a town's
# walls (they mark the road mouths) and walks outward from them; the old
# 16-direction sweep from the Gatekeeper is the fallback. A piste must be
# dry, walkable, outside every town zone, and:
#   GuardClearRadius   - this far from any standing guard. Keep it SMALL:
#                        the guards are the search's starting points (900
#                        here used to veto every spot next to them).
#   MonsterClearRadius - this far from any AGGRESSIVE monster.
# EVERY town zone in the world is a candidate: Giran first when in reach,
# then teleport towns (a Gatekeeper inside) nearest the quarreling pair,
# then any other town, and towns with a real player in them last. Towns are
# tried one after another until one has a clean piste; each failed town
# logs WHY in [FIELD-SCAN]. ArenaTownTries caps how many towns one staging
# may try (0 = all of them).
GuardClearRadius = 350
MonsterClearRadius = 700
ArenaTownTries = 0
# No-go circles for duels: "x,y,radius; x,y,radius" in world units. No
# piste, and no gate whose guard stands inside a circle, is used. The
# [FIELD-SCAN] line of every staged duel prints its piste coordinates, so a
# bad spot can be copied straight from the log. Default: Hunter Village's
# east gate, where fighters fell into a pit (playtest 2026-10-21).
ArenaBlockedSpots = 118372,73628,1200
# Cliff test: no piste where the ground falls away suddenly within
# ArenaEdgeRadius units - walking out in 32-unit steps, one step that drops
# more than ArenaMaxStep is a cliff or pit lip (open fields drop under 100
# per step, rough hills under 200; the Hunter Village pit lip dropped 416).
# Every town benefits, not just the ones you block by hand. ArenaMaxStep = 0
# turns the test off.
ArenaEdgeRadius = 500
ArenaMaxStep = 250
# The sea. The pack marks no water zone on its coasts and beaches slope too
# gently for the cliff test, so the waterline is a HEIGHT: ground below
# ArenaSeaLevel within ArenaShoreRadius of a duel spot is sea, and the spot
# is refused (counted as "wet or by the sea" in [FIELD-SCAN]). Measured in
# game at two waterlines on 2026-10-21 - Talking Island beach and Gludin
# Harbor, both /loc z = -3760: the sea is one flat level across the world.
# ArenaSeaLevel = 0 turns the test off.
ArenaSeaLevel = -3760
ArenaShoreRadius = 400
# Level bands (user, 2026-10-21): which towns host which duels, by the
# AVERAGE level of all fighters. Use each town's full name as the server
# names it. A range with * is PREFERRED: that town is the first choice for
# those duels. "any" makes a wildcard: every level, but only after the towns
# that fit. A listed town is never used for a duel outside its ranges.
# Unlisted towns (Floran Village, Primeval Isle) take any level, judged by
# the wildlife scan below alone. Order: preferred -> fitting -> unlisted ->
# wildcards; teleport towns first and nearest first inside each step.
ArenaTownBands = Talking Island: any, Elven Village: any, Dark Elven Village: any, Orc Village: any, Dwarven Village: any, Gludin Village: 20-40, Gludio Castle Town: 20-40, Dion Castle Town: 20-40, Giran Castle Town: 40-51* / 20-39 / 52-99, Hunter Village: 40-60, Heine: 45-60, Town of Oren: 52-99*, Town of Aden: 52-99*, Town of Goddard: 52-99, Rune Castle Town: 52-99, Town of Schuttgart: 52-99
# Wildlife scan, run on every duel spot: among the monsters within
# ArenaWildScanRadius (raid bosses and their minions don't count), the
# strongest typical one (90th percentile) may be at most ArenaWildLevelGap
# levels above the LOWEST fighter - the weakest one is who would get eaten.
# Open villages with no wall, so no gates: their duels are announced as "on
# the north-east side of Talking Island" instead of "outside the north-east
# gates of ...". Full town names as the server names them.
TownsWithoutGates = Talking Island, Elven Village, Dark Elven Village, Orc Village, Dwarven Village, Floran Village
ArenaWildScanRadius = 3000
ArenaWildLevelGap = 8
# Pre-fight runway, in seconds: the champions walk out, chat trash is done,
# and heralds drift toward the arena commenting in LOCAL chat about WHERE
# the fight is - then fists fly. Gives everyone time to get to the gates.
# 0 means the brawl starts immediately on staging. A GRAND brawl (3v3 or
# bigger) doubles this runway - spectacles need time to gather an audience.
FieldLeadSeconds = 150
# How many ordinary bots hold the breadcrumb posts on the road from the
# Gatekeeper out toward the arena, muttering local-chat directions on the
# way - one at the Gatekeeper landing, the rest at quarter-marks down the
# road. They are the trail that tells everyone where to run. Max 5.
# Retired 2026-10-19: arenas are easy to find now (crowds ring every fight
# and the call-outs name the place). Set above 0 to bring the posts back.
FieldHeralds = 0
# Fighter matching is LEVEL first, then gear: the fight picks the level both
# clans can field members closest to, each clan sends its members nearest
# that level (gear breaks ties), and any pairing more than MaxLevelGap
# levels apart is dropped (a 3v3 may shrink to 2v2, or the duel is called
# off). Logged as [FIELD-MATCH] with every fighter's level and gear score.
MaxLevelGap = 5
# Same idea for loadouts: a pairing whose gear scores (crystal grades per
# slot, weapon double, plus enchant) differ by more than MaxGearGap is
# dropped too. Lower = fairer but fewer duels. A fighter at or below
# BareGearMax (score 0-1: starter gear) only meets someone at most one point
# above it - "0 vs 4" used to pass and was over in 14 seconds.
MaxGearGap = 3
BareGearMax = 1
# 1v1 class pairings Interlude decides before they start, by party role
# (TANK, WARRIOR, DAGGER, ARCHER, NUKER, HEALER, BUFFER), comma-separated,
# either way round. Such a 1v1 is re-matched with other fighters; it only
# stands when no other fair pair exists. Group fights stay mixed. Mages also
# open every duel with a damage spell instead of a debuff.
AvoidSoloMatchups = DAGGER-NUKER
# Squad sizes. A normal duel rolls 1 to FieldMaxSquad a side (max 3). When
# no fair pair exists at all, the module bumps up: 2v2, then 3v3, fair as
# TEAMS (every pair within MaxLevelGap, the squads' average gear fair).
# EpicDuelChance percent of stagings are EPIC instead: EpicSquadMin to
# EpicSquadMax a side (4-9). An epic battle gets a triple runway, a third
# clan spreading the news in world chat, an extra address call, and a
# longer quiet afterward. Clans field fewer when they lack fair members.
FieldMaxSquad = 3
# EpicDuelChance ships at 0 in 0.3.0: no 4v4+ battle has been seen running
# in a real game yet. Try 4 (rare) once you want them.
EpicDuelChance = 0
EpicSquadMin = 4
EpicSquadMax = 9
# Grievances and alliance wars - ON HOLD in 0.3.0: built, but not seen working
# end to end yet. AllianceWars = False keeps every part of it off (no
# grievances, no alliance war, no alliance pools). Turn it on to experiment.
AllianceWars = False
# How it works when on. A quarrel between clans of
# two DIFFERENT alliances that ends unsatisfied - it fizzles out, ends in
# silence, or ends in a war cry that no duel answers within
# WarCryWindowMinutes - adds one grievance between those two alliances (a
# clan with no alliance stands for itself). A peace or a duel adds none.
# Every grievance raises the epic chance between them by EpicGrievanceStep
# percent, up to EpicChanceCap. At AllianceWarAt grievances the next quarrel
# between them (unless both clans are Peaceful) becomes an ALLIANCE WAR:
# allied clans of both sides join the argument in world chat (up to
# AllianceWarAllyLines lines), it ends in a war cry, and an EPIC battle is
# staged with fighters drawn from both whole alliances - Peaceful allies come
# along and complain about being dragged in. An epic battle between two
# alliances settles all their grievances. Grievances fade by one every
# GrievanceFadeHours of play (while someone is online) and are kept in
# records.properties across restarts. Clans of the same alliance never build
# grievances against each other.
EpicGrievanceStep = 3
EpicChanceCap = 40
AllianceWarAt = 6
GrievanceFadeHours = 3
WarCryWindowMinutes = 20
AllianceWarAllyLines = 4
# Skills a fighter never uses in a field duel (comma-separated, exact skill
# names, any case): monster-only or out-of-combat skills that make a
# fighter stall against a player - Spoil used to stop a Bounty Hunter from
# attacking at all. Fighters also get a weapon their skills can use: if a
# fighter's active skills demand a weapon type (a Warsmith's blunt, a
# dagger, a pole...) and it holds something else, it takes up a weapon of
# that type at the same grade for the fight ([GEAR] in the log).
FieldSkillBlacklist = Spoil,Spoil Festival,Sweeper,Festival Sweeper,Sow,Harvesting,Fake Death
# Clan records (records.properties next to personas.properties, kept across
# restarts): for every clan pair, the COMPLETED field duels (wins, losses,
# clean draws, the last winner, where and when) and how their last quarrel
# ended (truce or war cry, and what it was about). A duel cut short by a
# restart is never written. When the pair quarrels or meets in the field
# again, both sides are told their history and bring it up. A clan that LOST
# its last duel to a rival (unless Peaceful) wants revenge: it picks that
# rival RevengeBoost times as often for quarrels and taunts, and its odds of
# turning the next simmering quarrel into steel double. Logged as [RECORD]
# and [REVENGE]. Delete records.properties to wipe the history.
RevengeBoost = 3
# The skirmish bank: after ANY field duel, the roads go quiet for at least
# SkirmishCooldownSeconds before the next one may stage anywhere. Each
# fight also leaves HEAT behind, one notch per squad member (a 3v3 leaves
# 3): every notch adds SkirmishHeatStepSeconds to the next wait, and half
# an hour of calm cools one notch off. Big brawls literally burn more of
# the day's fighting than 1v1s do.
SkirmishCooldownSeconds = 240
SkirmishHeatStepSeconds = 90
# The brew: fights must be JUSTIFIED by real bickering. The automatic
# field scan only stages a duel for a clan pair whose argument produced
# at least BrewBeatsForSteel chat beats recently - argument replies in
# world/local chat count, as do public dares and their answers. The pot
# must also have simmered for at least BrewMinSeconds (so the decision
# feels made, not sudden), and stays hot for BrewWindowSeconds after the
# last beat. Chat drama first, fists after - never steel from thin air.
BrewBeatsForSteel = 3
BrewWindowSeconds = 900
BrewMinSeconds = 90
# Alliance brothers bicker longer before they draw steel: a pair from the
# same alliance needs BrewBeatsForSteel times this many beats (2 = six
# beats instead of three). With the default 12 clans in only 3 alliances,
# most quarrels are between brothers; this keeps their duels possible but
# rarer. 1 = no difference.
AllianceBrewFactor = 2
# Watcher patience: if a real PLAYER stands within PlayerGraceRadius of the
# arena, OR passes anywhere within PlayerRoadRadius of the straight line
# between the Gatekeeper landing and the arena (they are on the announced
# road), the first blow waits for them - re-checked every few seconds,
# extended while anyone lingers. Held at most PlayerGraceMaxSeconds past
# the scheduled start, ever. 0 disables.
PlayerGraceRadius = 3000
PlayerRoadRadius = 2200
PlayerGraceMaxSeconds = 180
# The fuse at the field. Every trash-talk line adds a HIDDEN amount to an
# aggression meter (AggressionPerJab "min-max", scaled by temperament:
# Player-Killing 140%, Aggressive 130%, Neutral 100%, Altruistic 90%,
# Peaceful 70%; open threats +8, jabs +4). At 100 the side that stirred more
# snaps and swings first. The first blow also falls when every fighter has
# said their piece while a watcher stands at the fence, or once a watcher has
# waited at the fence FenceMaxWaitSeconds. Logged as [FIELD-FUSE].
AggressionPerJab = 12-22
FenceMaxWaitSeconds = 60
# How close (to the arena centre) a watcher must stand to count as AT the
# fence: that starts the trash talk and the fence fuse. Fighters' local lines
# carry 1250 units from the speaker, so 900 keeps every line within earshot
# (at the old 1400, the far side's first jabs could be missed).
FenceRadius = 900
# A watcher RIGHT beside the fighters (within VeryCloseRadius of the arena)
# speeds things up: the first jab comes at once, then one every
# VeryCloseJabSeconds, and the fence wait drops to VeryCloseFenceSeconds.
VeryCloseRadius = 600
VeryCloseJabSeconds = 5
VeryCloseFenceSeconds = 25
# Crowd gossip (grand brawls with spectators): every CrowdGossipSeconds, with
# CrowdGossipChance percent odds, a fan tells the fan beside them about one
# fighter - their weapon and grade, class and level, or their clan's record
# (all real facts; gossip sometimes garbles one detail). With
# FighterAnswerChance percent odds the fighter confirms or corrects it.
# Logged as [CROWD-TALK] and [FIGHTER-REPLY].
CrowdGossipSeconds = 14
CrowdGossipChance = 70
FighterAnswerChance = 60

# Percent chance that ANY mention earns the "what's X stand for?" question
# at all. This rolls BEFORE the once-per-mentioned-clan-per-window cooldown
# (ClarifyCooldownHours above), so both keep clarifications rare: a small
# chance per mention, and never twice about the same clan in one window.
# Lower this further if the world asks too fast.
ClarifyChance = 40
